<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pustynny Rajd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2A1A10;--white:#fff;--gold:#FFC93C;--pink:#FF4F8B;--cyan:#33D6FF;--sand:#F2C48D;--glass:rgba(42,26,16,.66);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:rgba(20,12,8,.8)}}
:root[data-theme="dark"]{--glass:rgba(20,12,8,.8)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sand);touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#wrap{position:relative;width:100%;height:100%}
canvas#c{display:block;width:100%;height:100%}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pill{background:var(--glass);border-radius:14px;padding:6px 12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pos{font:400 40px/1 "Lilita One";background:var(--glass);border-radius:16px;padding:6px 14px 8px}
.pos small{font:800 13px "Nunito";opacity:.85;margin-left:4px}
#mini{width:132px;height:132px;background:var(--glass);border-radius:16px}
.speedo{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:right;pointer-events:none}
.speedo b{font:400 56px/0.9 "Lilita One";font-variant-numeric:tabular-nums;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;display:block}
.speedo small{font-weight:800;font-size:13px}
.nitro{width:170px;height:12px;border-radius:8px;background:rgba(0,0,0,.35);border:2px solid var(--ink);overflow:hidden;margin:6px 0 0 auto}
.nitro i{display:block;height:100%;width:50%;background:var(--cyan)}
.touch .speedo{bottom:auto;top:calc(160px + env(safe-area-inset-top,0px));right:10px}
.touch .speedo b{font-size:38px}.touch .nitro{width:120px}
.banner{position:absolute;left:50%;top:22%;transform:translate(-50%,0) scale(.7);text-align:center;opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.2,1.6,.4,1);pointer-events:none;width:92%}
.banner.show{opacity:1;transform:translate(-50%,0) scale(1)}
.banner b{display:block;font:400 clamp(36px,9vw,72px)/1 "Lilita One";color:var(--gold);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}
.banner small{display:inline-block;margin-top:8px;font-weight:800;font-size:16px;background:var(--glass);padding:5px 12px;border-radius:10px}
.tip{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass);padding:6px 12px;border-radius:12px;font-weight:800;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.touch .tip{bottom:calc(178px + env(safe-area-inset-bottom,0px))}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(42,26,16,.45)}
.overlay.hide{display:none}
.card{background:#FFF8EE;color:var(--ink);border-radius:26px;padding:24px 22px 22px;max-width:400px;width:100%;text-align:center;box-shadow:0 10px 0 var(--ink);border:3px solid var(--ink);max-height:100%;overflow:auto}
.card h1,.card h2{font:400 clamp(38px,10vw,54px)/.92 "Lilita One",sans-serif;margin:0 0 10px}
.card h1 span{display:block;color:#E8692C}
.card p{margin:0 0 16px;font-size:15px;line-height:1.45;color:#6B5444;font-weight:700}
.btns{display:flex;flex-direction:column;gap:12px;align-items:center}
.play{font:400 24px "Lilita One",sans-serif;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:11px 26px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-width:240px}
.play.alt{background:#fff}
.play:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.play:focus-visible,.btn-pause:focus-visible{outline:3px solid var(--pink)}
.keys{margin-top:14px;font-size:13px;color:#8A7060;line-height:1.55;font-weight:700}
.btn-pause{pointer-events:auto;background:var(--glass);border:0;color:#fff;border-radius:12px;width:40px;height:34px;font:800 15px "Nunito";cursor:pointer}
.joy{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:136px;height:136px;border-radius:50%;background:rgba(42,26,16,.25);border:3px solid rgba(255,255,255,.6);display:none;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.92);border:3px solid var(--ink)}
.tb{position:absolute;border-radius:50%;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font:400 16px "Lilita One";color:var(--ink);display:none;touch-action:none}
.tb.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.b-boost{right:18px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:88px;height:88px;background:var(--cyan)}
.b-drift{right:116px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:76px;height:76px;background:var(--gold)}
.pill.opp{border:2px solid #ffd24a}
.pill.tankc{background:rgba(120,0,16,.88);border:2px solid #ff3b4a}
.warn{position:absolute;left:50%;top:15%;transform:translateX(-50%);background:rgba(196,20,40,.92);color:#fff;font:400 22px "Lilita One";padding:6px 16px;border-radius:12px;border:3px solid var(--ink);display:none;pointer-events:none;white-space:nowrap;animation:blinkw .5s steps(2) infinite}
@keyframes blinkw{50%{opacity:.5}}
.play.small{font-size:15px;min-width:200px;padding:6px 14px;box-shadow:0 3px 0 var(--ink)}
.chain{font-size:13px;line-height:1.6;color:#6b5444;font-weight:800;margin:2px 0 4px;text-align:left}
.b-reset{right:122px;bottom:calc(102px + env(safe-area-inset-bottom,0px));width:54px;height:54px;background:#ffd9e4;font-size:13px}
.b-exit{right:44px;bottom:calc(132px + env(safe-area-inset-bottom,0px));width:64px;height:64px;background:#fff;font-size:12px}
.touch .joy,.touch .tb{display:block}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="col">
      <div class="pos" id="pos">1<small>/2</small></div>
      <div class="pill" id="lap">Okrążenie 1/3</div>
      <div class="pill" id="time">0:00.0</div>
      <div class="pill" id="coinsP">Monety 0/12</div>
      <div class="pill opp" id="oppName" style="display:none"></div>
    </div>
    <div class="col" style="align-items:flex-end">
      <div style="display:flex;gap:6px"><canvas id="mini" width="264" height="264"></canvas></div>
      <button class="btn-pause" id="pauseBtn" aria-label="Pauza">II</button>
    </div>
  </div>
  <div class="speedo"><b id="spd">0</b><small>km/h</small><div class="nitro"><i id="nitro"></i></div></div>
  <div class="banner" id="banner"><b id="bT"></b><small id="bS"></small></div>
  <div class="warn" id="warn"></div>
  <div class="tip" id="tip"></div>
  <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
  <button class="tb b-boost" id="boostBtn">Boost</button>
  <button class="tb b-drift" id="driftBtn">Drift</button>
  <button class="tb b-reset" id="resetBtn">Tor</button>
  <button class="tb b-exit" id="exitBtn">Wysiądź</button>

  <div class="overlay" id="menu"><div class="card">
    <h1>Pustynny<span>Rajd</span></h1>
    <p>Pokonuj coraz szybszych rywali. Na końcu czeka czołg, którego nie da się pokonać. Uważaj na przeszkody na torze!</p>
    <div class="btns">
      <button class="play" id="careerBtn">Kariera</button>
      <div class="chain" id="careerInfo"></div>
      <button class="play alt" id="raceBtn">Szybki wyścig</button>
      <button class="play alt" id="lvlBtn">Bot: Normalny</button>
      <button class="play alt" id="freeBtn">Wolna jazda</button>
      <button class="play alt small" id="careerReset">Zacznij karierę od nowa</button>
    </div>
    <div class="keys" id="keys"></div>
  </div></div>
  <div class="overlay hide" id="pause"><div class="card">
    <h2>Pauza</h2><p>Silnik na luzie.</p>
    <div class="btns"><button class="play" id="resumeBtn">Graj dalej</button><button class="play alt" id="menuBtn">Menu</button></div>
  </div></div>
  <div class="overlay hide" id="result"><div class="card">
    <h2 id="rT">Wygrana</h2><p id="rS"></p>
    <div class="btns"><button class="play" id="againBtn">Jeszcze raz</button><button class="play alt" id="menuBtn2">Menu</button><button class="play alt" id="freeBtn2">Wolna jazda</button></div>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const isTouch = ('ontouchstart' in window) || matchMedia('(pointer: coarse)').matches;
  if (isTouch) document.body.classList.add('touch');
  $('keys').innerHTML = isTouch
    ? 'Joystick: gaz, hamulec i skręt. Drift i Boost po prawej. Wysiądź, żeby chodzić po pustyni.'
    : 'WASD lub strzałki: jazda. Spacja: drift. Shift: boost.<br>E: wysiądź lub wsiądź. R: wróć na tor. P: pauza.';

  // ---------- audio ----------
  let AC = null, engO = null, engG = null;
  function ac() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} return AC; }
  function tone(f, d, type = 'square', v = 0.05, slide = 0) {
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);
  }
  function engine(on) {
    const a = ac(); if (!a) return;
    if (on && !engO) { engO = a.createOscillator(); engG = a.createGain(); engO.type = 'sawtooth'; engO.frequency.value = 50; engG.gain.value = 0.0; const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600; engO.connect(lp); lp.connect(engG); engG.connect(a.destination); engO.start(); }
    if (!on && engO) { try { engO.stop(); } catch (e) {} engO = null; engG = null; }
    tankEngine(on && oppTank);
  }
  const SFX = {
    squash: () => { tone(140, 0.35, 'sawtooth', 0.09, -90); setTimeout(() => tone(1500, 0.25, 'square', 0.04, -900), 80); setTimeout(() => tone(260, 0.15, 'square', 0.04, 200), 330); },
    thump: () => tone(90, 0.12, 'triangle', 0.07, -40),
    cp: () => { tone(880, 0.07, 'square', 0.05); setTimeout(() => tone(1175, 0.1, 'square', 0.05), 70); },
    beep: () => tone(440, 0.25, 'square', 0.06), go: () => tone(880, 0.5, 'square', 0.07),
    boost: () => tone(300, 0.5, 'sawtooth', 0.05, 600), coin: () => { tone(988, 0.07, 'square', 0.04); setTimeout(() => tone(1319, 0.14, 'square', 0.04), 60); },
    crash: () => tone(120, 0.25, 'sawtooth', 0.07, -60), lap: () => [659, 784, 988].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'triangle', 0.06), i * 90)),
    win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'square', 0.05), i * 120)),
    jump: () => tone(300, 0.12, 'square', 0.03, 250), door: () => tone(180, 0.08, 'triangle', 0.06)
  };

  // ---------- three ----------
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf3cf9c, 120, 520);
  const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 1500);
  scene.add(new THREE.HemisphereLight(0xfff1dc, 0xc98a52, 0.75));
  const sun = new THREE.DirectionalLight(0xfff0d0, 0.9);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 220 });
  scene.add(sun, sun.target);
  function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();

  // sky dome
  const skyGeo = new THREE.SphereGeometry(900, 32, 16), skyCol = [];
  const top = new THREE.Color(0x5fb4ff), hor = new THREE.Color(0xffd9a8);
  for (let i = 0; i < skyGeo.attributes.position.count; i++) { const y = skyGeo.attributes.position.getY(i) / 900; const c = hor.clone().lerp(top, Math.pow(Math.max(0, y), 0.6)); skyCol.push(c.r, c.g, c.b); }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(skyCol, 3));
  scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
  const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(40, 32), new THREE.MeshBasicMaterial({ color: 0xfff3c4, fog: false }));
  sunDisc.position.set(-500, 300, -600); sunDisc.lookAt(0, 0, 0); scene.add(sunDisc);

  // textures
  function canvasTex(w, h, draw, rep) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(rep[0], rep[1]); t.anisotropy = 4; return t; }
  const sandTex = canvasTex(128, 128, (x, w, h) => { x.fillStyle = '#f0c28a'; x.fillRect(0, 0, w, h); for (let i = 0; i < 900; i++) { x.fillStyle = Math.random() < 0.5 ? 'rgba(180,120,60,.18)' : 'rgba(255,240,210,.25)'; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); } }, [180, 180]);
  const roadTex = canvasTex(64, 128, (x, w, h) => { x.fillStyle = '#4a4552'; x.fillRect(0, 0, w, h); for (let i = 0; i < 400; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * 0.06})`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); } x.fillStyle = '#ffe9a8'; x.fillRect(30, 0, 4, 64); });
  roadTex.magFilter = THREE.LinearFilter;
  const curbTex = canvasTex(8, 32, (x) => { x.fillStyle = '#ff4f4f'; x.fillRect(0, 0, 8, 16); x.fillStyle = '#ffffff'; x.fillRect(0, 16, 8, 16); });
  curbTex.magFilter = THREE.NearestFilter;
  const checkTex = canvasTex(64, 16, (x) => { for (let i = 0; i < 16; i++) for (let j = 0; j < 4; j++) { x.fillStyle = (i + j) % 2 ? '#111' : '#fff'; x.fillRect(i * 4, j * 4, 4, 4); } });
  checkTex.magFilter = THREE.NearestFilter;
  const arrowTex = canvasTex(64, 64, (x) => { x.fillStyle = '#1ec8ff'; x.fillRect(0, 0, 64, 64); x.fillStyle = '#eaffff'; for (let k = 0; k < 2; k++) { x.beginPath(); x.moveTo(12, 30 - k * 22 + 22); x.lineTo(32, 10 - k * 22 + 22); x.lineTo(52, 30 - k * 22 + 22); x.lineTo(52, 40 - k * 22 + 22); x.lineTo(32, 20 - k * 22 + 22); x.lineTo(12, 40 - k * 22 + 22); x.fill(); } });

  // ground
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.MeshStandardMaterial({ map: sandTex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  // ---------- track ----------
  const CTRL = [[0, -120], [80, -132], [145, -92], [155, -10], [112, 42], [62, 32], [30, 74], [64, 124], [12, 165], [-70, 152], [-122, 92], [-100, 22], [-142, -42], [-112, -112], [-52, -140]];
  const curve = new THREE.CatmullRomCurve3(CTRL.map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'catmullrom', 0.5);
  const N = 800, W = 18;
  const SP = curve.getSpacedPoints(N).slice(0, N);
  const TAN = SP.map((p, i) => SP[(i + 1) % N].clone().sub(p).normalize());
  const NOR = TAN.map(t => new THREE.Vector3(t.z, 0, -t.x));
  const segLen = curve.getLength() / N;
  // speed profile for the bot: curvature -> safe speed -> braking-aware profile
  const SEGM = Math.hypot(SP[1].x - SP[0].x, SP[1].z - SP[0].z), KAP = new Float64Array(N), VPROF = new Float64Array(N);
  (() => {
    const raw = new Float64Array(N);
    for (let i = 0; i < N; i++) { const a = TAN[(i - 3 + N) % N], b = TAN[(i + 3) % N]; raw[i] = Math.acos(Math.max(-1, Math.min(1, a.x * b.x + a.z * b.z))) / (6 * SEGM); }
    for (let i = 0; i < N; i++) { let sm = 0; for (let k = -4; k <= 4; k++) sm += raw[(i + k + N) % N]; KAP[i] = sm / 9; }
    for (let i = 0; i < N; i++) VPROF[i] = Math.min(44, Math.sqrt(23 / Math.max(KAP[i], 1e-4)));
    for (let pass = 0; pass < 3; pass++) for (let i = N - 1; i >= 0; i--) VPROF[i] = Math.min(VPROF[i], Math.sqrt(VPROF[(i + 1) % N] * VPROF[(i + 1) % N] + 2 * 30 * SEGM));
  })();
  // bot dodge groups (hazard layout) -> lane offsets and speed caps; tank speed profile
  const smooth01 = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
  const BGROUPS = [{ idx: 28, lane: -3.6, cap: 33 }, { idx: 60, lane: 4.8, cap: 30 }, { idx: 92, lane: -4.8, cap: 30 }, { idx: 124, lane: 4.8, cap: 30 }, { idx: 196, lane: -2.8, cap: 36 }, { idx: 214, lane: 2.8, cap: 36 }, { idx: 396, lane: -3.6, cap: 40 }, { idx: 421, lane: 3.6, cap: 40 }, { idx: 570, lane: 3.4, cap: 36 }, { idx: 744, lane: -3.4, cap: 36 }];
  const TPROF = new Float64Array(N), TT = new Float64Array(N + 1), BPROF = new Float64Array(N), LANE = new Float64Array(N);
  (() => {
    for (let i = 0; i < N; i++) TPROF[i] = Math.min(92, Math.sqrt(85 / Math.max(KAP[i], 1e-4)));
    for (let pass = 0; pass < 3; pass++) for (let i = N - 1; i >= 0; i--) TPROF[i] = Math.min(TPROF[i], Math.sqrt(TPROF[(i + 1) % N] * TPROF[(i + 1) % N] + 2 * 60 * SEGM));
    TT[0] = 0; for (let i = 0; i < N; i++) TT[i + 1] = TT[i] + SEGM / TPROF[i];
    for (let i = 0; i < N; i++) BPROF[i] = VPROF[i];
    BGROUPS.forEach(gp => { for (let k = -22; k <= 6; k++) { const i = (gp.idx + k + N) % N; BPROF[i] = Math.min(BPROF[i], gp.cap); } });
    for (let pass = 0; pass < 3; pass++) for (let i = N - 1; i >= 0; i--) BPROF[i] = Math.min(BPROF[i], Math.sqrt(BPROF[(i + 1) % N] * BPROF[(i + 1) % N] + 2 * 30 * SEGM));
    const raw = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      let sum = 0;
      BGROUPS.forEach(gp => { const ahead = ((gp.idx - i + N + 8) % N) - 8; if (ahead >= -6 && ahead <= 26) sum += gp.lane * (ahead > 12 ? smooth01((26 - ahead) / 14) : ahead >= -2 ? 1 : smooth01((ahead + 6) / 4)); });
      raw[i] = Math.max(-5.6, Math.min(5.6, sum));
    }
    for (let i = 0; i < N; i++) { let sm = 0; for (let k = -3; k <= 3; k++) sm += raw[(i + k + N) % N]; LANE[i] = sm / 7; }
  })();
  const roadT = (a, L) => { const b = a + L; return b <= N ? TT[b] - TT[a] : TT[N] - TT[a] + TT[b - N]; };

  function ribbon(off0, off1, y, tex, vScale) {
    const pos = [], uv = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const k = i % N, p = SP[k], n = NOR[k];
      pos.push(p.x + n.x * off0, y, p.z + n.z * off0, p.x + n.x * off1, y, p.z + n.z * off1);
      const v = i * segLen / vScale; uv.push(0, v, 1, v);
      if (i < N) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9, side: THREE.DoubleSide }));
    m.receiveShadow = true; scene.add(m); return m;
  }
  ribbon(-W / 2, W / 2, 0.03, roadTex, 10);

      const ch = Math.sin(camPitch) * 9, cr = Math.cos(camPitch) * 9;
      tx = WK.x + Math.sin(camYaw) * cr; ty = WK.y + 2 + ch; tz = WK.z + Math.cos(camYaw) * cr; lx = WK.x; ly = WK.y + 1.6; lz = WK.z;
    } else {
      const spd = Math.hypot(car.vx, car.vz);
      if (state === 'menu') { const a = T * 0.15; tx = car.x + Math.sin(a) * 16; ty = 5; tz = car.z + Math.cos(a) * 16; lx = car.x + Math.sin(car.h) * 5; ly = car.y + 1.4; lz = car.z + Math.cos(car.h) * 5; }
      else {
        const vdir = spd > 4 ? Math.atan2(car.vx, car.vz) : car.h; let dv = vdir - car.h; dv = Math.atan2(Math.sin(dv), Math.cos(dv));
        const tgtH = car.h + dv * 0.55 * Math.min(1, spd / 14); let dh = tgtH - camH; dh = Math.atan2(Math.sin(dh), Math.cos(dh)); camH += dh * (1 - Math.exp(-6 * dt));
        const dist = 9.5 + spd * 0.06, hgt = 3.8 + spd * 0.025;
        tx = car.x - Math.sin(camH) * dist; ty = car.y * 0.6 + hgt; tz = car.z - Math.cos(camH) * dist;
        lx = car.x + Math.sin(camH) * 6; ly = car.y + 1.3; lz = car.z + Math.cos(camH) * 6;
      }
    }
    const k = 1 - Math.exp(-(onFoot ? 12 : state === 'menu' ? 7 : 22) * dt);
    camera.position.x += (tx - camera.position.x) * k; camera.position.y += (ty - camera.position.y) * k; camera.position.z += (tz - camera.position.z) * k;
    camera.lookAt(lx, ly, lz);
    const fov = 70 + (car._boost && !onFoot ? 12 : 0) + (onFoot ? 0 : Math.min(8, Math.hypot(car.vx, car.vz) * 0.12));
    camera.fov += (fov - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();
    const fx0 = onFoot ? WK.x : car.x, fz0 = onFoot ? WK.z : car.z;
    sun.position.set(fx0 - 40, 80, fz0 - 30); sun.target.position.set(fx0, 0, fz0);
    PADS.forEach(p => p.m.material.emissiveIntensity = 0.5 + Math.sin(T * 8) * 0.3);
    gates.forEach((gt, k) => { gt.mat.color.setHex(k === car.cp ? 0x3ddc84 : 0xb4bccb); });
    renderer.render(scene, camera);
  }

  let lastT = performance.now(), miniT = 0;
  function loop(now) {
    const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now;
    if (state !== 'menu' && !paused) { step(dt); hud(); }
    else if (state === 'menu') T += dt;
    render(paused ? 0 : dt);
    miniT -= dt; if (miniT <= 0) { drawMini(); miniT = 0.05; }
    requestAnimationFrame(loop);
  }

  function togglePause() {
    if (state === 'menu' || !$('result').classList.contains('hide')) return;
    paused = !paused; $('pause').classList.toggle('hide', !paused); engine(!paused);
  }
  function toMenu() { state = 'menu'; paused = false; onFoot = false; walker.visible = false; engine(false); tankEngine(false); tank.g.visible = false; $('warn').style.display = 'none'; renderCareer(); ['pause', 'result'].forEach(id => $(id).classList.add('hide')); $('menu').classList.remove('hide'); }
  const BOT_LV = [['Łatwy', 0.9, 101, 0, 0.01], ['Normalny', 1.0, 45, 0, 0.01], ['Trudny', 1.1, 25, 5, 0.014], ['Mistrz', 1.22, 8, 14, 0.022]];
  let botLv = 1; try { const v = parseInt(localStorage.getItem('pr-lv'), 10); if (v >= 0 && v < 4) botLv = v; } catch (e) {}
  const OPPS = [
    { name: 'Rudy Rajdowiec', col: 0x3b7cff, acc: 0xf3f6fb, f: 0.90, nitro: 101, drift: false },
    { name: 'Pustynny Lis', col: 0x3ddc84, acc: 0xffffff, f: 1.00, nitro: 55, drift: true },
    { name: 'Szejk Szybki', col: 0xffc93c, acc: 0x16213a, f: 1.10, nitro: 30, regen: 5, boostK: 0.014, drift: true },
    { name: 'Mistrz Piasków', col: 0xb44bff, acc: 0xffc93c, f: 1.22, nitro: 8, regen: 14, boostK: 0.022, drift: true },
    { name: 'CZOŁG', tank: true }
  ];
  let career = 0; try { career = Math.max(0, Math.min(OPPS.length - 1, parseInt(localStorage.getItem('pr-career'), 10) || 0)); } catch (e) {}
  const saveCareer = () => { try { localStorage.setItem('pr-career', String(career)); } catch (e) {} };
  const careerCfg = i => Object.assign({ kind: 'career', lv: i }, OPPS[i]);
  function renderCareer() {
    $('careerBtn').textContent = 'Kariera: wyścig ' + (career + 1) + '/' + OPPS.length;
    $('careerInfo').innerHTML = OPPS.map((o, i) => (i < career ? '✓ ' : i === career ? '▶ ' : '🔒 ') + (o.tank && i > career ? '☠ ???' : o.name + (o.tank ? ' ☠' : ''))).join('<br>');
  }
  $('careerBtn').onclick = () => setup('race', careerCfg(career));
  $('careerReset').onclick = () => { career = 0; saveCareer(); renderCareer(); };
  $('lvlBtn').textContent = 'Bot: ' + BOT_LV[botLv][0];
  $('lvlBtn').onclick = () => { botLv = (botLv + 1) % 4; $('lvlBtn').textContent = 'Bot: ' + BOT_LV[botLv][0]; try { localStorage.setItem('pr-lv', String(botLv)); } catch (e) {} };
  $('raceBtn').onclick = () => setup('race'); $('freeBtn').onclick = () => setup('free'); $('freeBtn2').onclick = () => setup('free');
  $('againBtn').onclick = () => setup('race', pendingCfg || undefined); $('menuBtn2').onclick = toMenu; $('resumeBtn').onclick = togglePause; $('menuBtn').onclick = toMenu; $('pauseBtn').onclick = togglePause;
  document.addEventListener('visibilitychange', () => { if (document.hidden && state !== 'menu' && !paused) togglePause(); });

  placeCar(car, N - 14, -4); placeCar(bot, N - 14, 4); bot.g.visible = true; renderCareer();
  camera.position.set(car.x + 10, 6, car.z + 10);
  requestAnimationFrame(loop);
})();
</script>
</body>
